[build]
  base = "apps/web"
  command = "pnpm --filter @bugreceipt/web build"
  publish = "dist/client"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml apps/web package.json pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.7.0"

[dev]
  command = "pnpm --filter @bugreceipt/web dev"
  targetPort = 3000
  port = 8888
