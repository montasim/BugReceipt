[build]
  base = "/"
  command = "pnpm --filter @bugreceipt/web build"
  publish = "apps/web/dist/client"

[functions]
  directory = "apps/web/.netlify/v1/functions"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.7.0"

[dev]
  command = "pnpm --filter @bugreceipt/web dev"
  targetPort = 3000
  port = 8888
