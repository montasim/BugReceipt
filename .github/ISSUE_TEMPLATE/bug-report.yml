name: Bug report
description: Report a reproducible, non-sensitive BugReceipt problem.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real capture bundles, recordings, credentials, personal information, or production request bodies. Use GitHub private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: BugReceipt version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: 120 or newer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a safe public fixture or redact sensitive page details.
      placeholder: |
        1. Open …
        2. Start BugReceipt …
        3. Select …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Capture permissions or start
        - Screen recording or screenshot
        - Console evidence
        - Network evidence
        - Review and redaction
        - Download or clipboard export
        - Email delivery
        - Landing page or installation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed credentials, personal data, recordings, and production payloads.
          required: true
