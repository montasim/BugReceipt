<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BugReceipt · Extension UI prototype</title>
    <style>
      @font-face {
        font-family: Bricolage;
        src: url('/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 800;
        font-display: swap;
      }
      @font-face {
        font-family: JetBrains;
        src: url('/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 800;
        font-display: swap;
      }
      :root {
        --ink: #102332;
        --ink-2: #1a3444;
        --muted: #536873;
        --paper: #f8fbfc;
        --fog: #eef3f5;
        --line: #bacbd2;
        --line-soft: #d8e3e7;
        --signal: #ff5c3a;
        --signal-text: #c33b24;
        --trace: #1f9fae;
        --trace-text: #0b6f7a;
        --trace-soft: #d9f0f1;
        --warn: #9a5b00;
        --warn-soft: #fff4d9;
        --danger: #ad2d20;
        --danger-soft: #fff0ed;
        --ok: #0b6f63;
        --shadow: 0 16px 38px rgb(0 0 0 / 0.14);
        --mono: JetBrains, ui-monospace, monospace;
        --sans: Bricolage, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: #dfe8eb;
        color: var(--ink);
        font-family: var(--sans);
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--fog);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      select {
        min-height: 44px;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      :focus-visible {
        outline: 3px solid var(--trace);
        outline-offset: 3px;
      }
      ::selection {
        background: var(--ink);
        color: white;
      }
      ::placeholder {
        color: #6c7e87;
        opacity: 1;
      }
      * {
        scrollbar-color: var(--trace) var(--fog);
        scrollbar-width: thin;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .app {
        min-height: 100vh;
        padding-bottom: 84px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        font-weight: 780;
        letter-spacing: -0.025em;
      }
      .brand-mark {
        width: 25px;
        display: grid;
        gap: 3px;
        transform: skewX(-9deg);
      }
      .brand-mark i {
        display: block;
        height: 4px;
        background: var(--ink);
      }
      .brand-mark i:nth-child(2) {
        width: 74%;
        background: var(--signal);
      }
      .brand-mark i:nth-child(3) {
        width: 48%;
        background: var(--trace);
      }
      .app-header {
        height: 66px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 0 28px;
        background: rgb(248 251 252 / 0.97);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .header-context {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }
      .header-context::before {
        content: '';
        width: 1px;
        height: 28px;
        background: var(--line);
      }
      .header-context div {
        min-width: 0;
      }
      .header-context strong {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .header-context span,
      .local-status {
        color: var(--muted);
        font: 650 11px/1.4 var(--mono);
      }
      .local-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .local-status i {
        width: 8px;
        height: 8px;
        background: var(--trace);
        border-radius: 50%;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 44px;
        padding: 10px 15px;
        border: 1px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        font-weight: 720;
        text-decoration: none;
        transition:
          transform 140ms cubic-bezier(0.16, 1, 0.3, 1),
          background 140ms ease,
          color 140ms ease,
          box-shadow 140ms ease;
      }
      .button:hover:not(:disabled) {
        transform: translateY(-1px);
      }
      .button.primary {
        background: var(--ink);
        color: white;
        box-shadow: 0 9px 22px rgb(0 0 0 / 0.16);
      }
      .button.primary:hover:not(:disabled) {
        background: var(--ink-2);
      }
      .button.signal {
        background: var(--signal);
        color: white;
        border-color: var(--signal-text);
      }
      .button.quiet {
        border-color: var(--line);
      }
      .button.danger {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: #dc988f;
      }
      .button.icon {
        width: 44px;
        padding: 0;
      }
      .button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
        box-shadow: none;
      }
      .button svg,
      .icon svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .review-shell {
        min-height: calc(100vh - 84px);
        display: grid;
        grid-template-columns: 292px minmax(0, 1fr);
      }
      .receipt-spine {
        background: var(--paper);
        border-right: 1px solid var(--line);
        padding: 30px 24px;
        position: sticky;
        top: 66px;
        height: calc(100vh - 150px);
        overflow: auto;
      }
      .receipt-spine::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        border-left: 4px dotted #dfe8eb;
      }
      .receipt-title {
        margin: 0 0 26px;
        font-size: 22px;
        letter-spacing: -0.025em;
      }
      .receipt-title small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.04em;
      }
      .stage {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 10px;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        align-items: start;
      }
      .stage:last-of-type {
        border-bottom: 1px solid var(--line);
      }
      .stage-num {
        font: 620 12px/1.4 var(--mono);
        color: var(--muted);
      }
      .stage strong {
        display: block;
        font-size: 16px;
      }
      .stage small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        line-height: 1.4;
      }
      .stage.active strong {
        color: var(--signal-text);
      }
      .stage-mark {
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        color: var(--muted);
        font: 700 11px var(--mono);
      }
      .stage.done .stage-mark {
        background: var(--trace);
        border-color: var(--trace);
        color: white;
      }
      .stage.active .stage-mark {
        background: var(--signal);
        border-color: var(--signal);
        color: white;
      }
      .receipt-list {
        list-style: none;
        padding: 0;
        margin: 24px 0;
      }
      .receipt-list li {
        display: grid;
        grid-template-columns: 20px 1fr auto;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        border-bottom: 1px solid var(--line-soft);
        font-size: 14px;
      }
      .receipt-list b {
        font: 650 12px var(--mono);
      }
      .receipt-list .attention {
        color: var(--signal-text);
      }
      .receipt-foot {
        margin-top: 26px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .workspace {
        min-width: 0;
        padding: 28px 34px 44px;
        animation: sheet-in 260ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes sheet-in {
        from {
          clip-path: inset(0 0 100% 0);
        }
        to {
          clip-path: inset(0);
        }
      }
      .workspace-heading {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        margin-bottom: 22px;
      }
      .workspace-heading h1 {
        margin: 0;
        max-width: 780px;
        font-size: clamp(20.4px, 2.4vw, 32.4px);
        line-height: 1;
        font-weight: 650;
        letter-spacing: -0.04em;
      }
      .workspace-heading p {
        margin: 10px 0 0;
        max-width: 70ch;
        color: var(--muted);
        line-height: 1.55;
      }
      .workspace-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }
      .tabs {
        display: flex;
        overflow-x: auto;
        border: 1px solid var(--line);
        background: var(--paper);
      }
      .tab {
        min-width: 140px;
        flex: 0 0 auto;
        border: 0;
        border-right: 1px solid var(--line);
        padding: 12px 18px;
        background: transparent;
        color: var(--muted);
        text-align: left;
        font-weight: 700;
      }
      .tab[aria-selected='true'] {
        background: var(--ink);
        color: white;
        box-shadow: inset 0 -3px var(--signal);
      }
      .tab span {
        margin-left: 8px;
        font: 650 11px var(--mono);
        opacity: 0.8;
      }
      .panel {
        border: 1px solid var(--line);
        background: var(--paper);
      }
      .panel-head {
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .panel-head strong {
        font-size: 18px;
      }
      .panel-head p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .canvas {
        min-height: 480px;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #f3f6f7;
      }
      .captured-page {
        width: min(880px, 100%);
        min-height: 400px;
        background: white;
        border: 1px solid var(--ink);
        box-shadow: var(--shadow);
        display: grid;
        grid-template-columns: 1fr 0.9fr;
        gap: 34px;
        padding: 48px;
        align-items: center;
      }
      .captured-page h2 {
        margin: 0;
        font-size: clamp(28px, 3vw, 46px);
        line-height: 1.02;
        letter-spacing: -0.035em;
      }
      .captured-page p {
        color: var(--muted);
        line-height: 1.55;
      }
      .failure-card {
        border: 1px solid var(--line);
        padding: 18px;
      }
      .failure-card .failed {
        margin-top: 18px;
        padding: 12px;
        border: 1px solid #e9a096;
        background: var(--danger-soft);
        color: var(--danger);
        font-weight: 700;
      }
      .canvas-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-top: 1px solid var(--line);
        background: var(--paper);
      }
      .canvas-footer .spacer {
        flex: 1;
      }
      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        font: 650 11px var(--mono);
      }
      .status-chip.ok {
        color: var(--ok);
        background: var(--trace-soft);
        border-color: #9acfd3;
      }
      .status-chip.warn {
        color: #704300;
        background: var(--warn-soft);
        border-color: #dfb15e;
      }
      .notice {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 12px;
        align-items: start;
        margin-bottom: 16px;
        padding: 13px 15px;
        border: 1px solid var(--line);
        background: var(--paper);
      }
      .notice strong {
        display: block;
      }
      .notice p {
        margin: 3px 0 0;
        color: var(--muted);
      }
      .notice.error {
        border-color: #df9a90;
        background: var(--danger-soft);
        color: var(--danger);
      }
      .notice.warning {
        border-color: #ddb364;
        background: var(--warn-soft);
        color: #704300;
      }
      .notice.success {
        border-color: #86c6be;
        background: #e6f5f2;
        color: var(--ok);
      }
      .notice-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .receipt-table {
        width: 100%;
        border-collapse: collapse;
      }
      .receipt-table th,
      .receipt-table td {
        padding: 13px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .receipt-table th {
        color: var(--muted);
        font: 650 10px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .receipt-table td:last-child {
        font-family: var(--mono);
        font-size: 12px;
      }
      .report-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
        gap: 18px;
      }
      .form-sheet,
      .context-sheet {
        padding: 22px;
      }
      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 7px;
        font-weight: 700;
      }
      .field label small {
        color: var(--muted);
        font: 600 10px var(--mono);
      }
      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: white;
        color: var(--ink);
        padding: 12px;
      }
      .field textarea {
        min-height: 92px;
        resize: vertical;
      }
      .field.invalid input,
      .field.invalid textarea {
        border-color: var(--danger);
        background: #fff9f8;
      }
      .field-error {
        color: var(--danger);
        font-size: 12px;
        margin-top: 5px;
      }
      .context-sheet dl {
        margin: 0;
      }
      .context-sheet div {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      .context-sheet dt {
        color: var(--muted);
        font: 650 10px var(--mono);
        text-transform: uppercase;
      }
      .context-sheet dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .console {
        background: var(--ink);
        color: #d9e8ed;
        padding: 18px;
        min-height: 460px;
        font: 500 12px/1.55 var(--mono);
      }
      .console-row {
        display: grid;
        grid-template-columns: 70px 60px 1fr auto;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid rgb(186 203 210 / 0.18);
      }
      .console-row.error {
        color: #ffb4a5;
      }
      .console-row mark {
        background: #fff3a6;
        color: #102332;
        padding: 1px 3px;
      }
      .network-list {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .network-row {
        display: grid;
        grid-template-columns: 70px 70px minmax(0, 1fr) 90px 44px;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .network-row code {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .network-row.failed {
        background: var(--danger-soft);
      }
      .annotation-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px;
        background: var(--ink);
        color: white;
      }
      .annotation-toolbar .button {
        background: transparent;
        color: white;
        border-color: #587080;
      }
      .annotation-toolbar .button.active {
        background: var(--signal);
        border-color: var(--signal);
      }
      .annotation-canvas {
        position: relative;
      }
      .annotation-box {
        position: absolute;
        left: 55%;
        top: 49%;
        width: 29%;
        height: 14%;
        border: 5px solid var(--signal);
        pointer-events: none;
      }
      .annotation-note {
        position: absolute;
        left: 59%;
        top: 64%;
        max-width: 240px;
        padding: 9px 11px;
        background: var(--signal);
        color: white;
        font-weight: 700;
      }
      .diagnostic-focus {
        padding: 12px 16px;
        border-bottom: 1px solid #587080;
        background: #173042;
        color: white;
      }
      .diagnostic-focus strong {
        display: block;
      }
      .diagnostic-focus p {
        margin: 4px 0 0;
        color: #c4d7de;
      }
      .console-row.selected {
        margin: 8px -8px;
        padding: 12px 8px;
        outline: 2px solid var(--signal);
        background: rgb(255 255 255 / 0.06);
      }
      .frame-empty {
        min-height: 430px;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
      }
      .frame-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 10px;
        border-top: 1px solid var(--line);
      }
      .frame-strip button {
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--line);
        background: white;
        text-align: left;
      }
      .frame-strip button[aria-current='true'] {
        border-color: var(--signal);
        box-shadow: inset 0 -3px var(--signal);
      }
      .dialog-backdrop {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgb(16 35 50 / 0.68);
      }
      .dialog {
        width: min(520px, 100%);
        border: 1px solid var(--ink);
        padding: 26px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }
      .dialog h2 {
        margin: 0 0 10px;
        font-size: 30px;
      }
      .dialog p {
        color: var(--muted);
        line-height: 1.55;
      }
      .dialog .action-row {
        justify-content: flex-end;
      }
      .state-page {
        min-height: 560px;
        display: grid;
        place-items: center;
        padding: 36px;
        background: var(--paper);
        border: 1px solid var(--line);
      }
      .state-card {
        width: min(620px, 100%);
        padding: 28px;
        background: var(--fog);
      }
      .state-card h2 {
        margin: 0 0 10px;
        font-size: 34px;
        line-height: 1.05;
        letter-spacing: -0.035em;
      }
      .state-card p {
        color: var(--muted);
        line-height: 1.55;
      }
      .state-card > details {
        margin-top: 16px;
      }
      .state-card .state-symbol {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        margin-bottom: 22px;
        border: 1px solid var(--ink);
        font: 800 20px var(--mono);
      }
      .skeleton {
        width: 100%;
        max-width: 900px;
        display: grid;
        gap: 12px;
      }
      .skeleton i {
        display: block;
        height: 20px;
        background: #dce6e9;
        animation: pulse 1.2s ease-in-out infinite alternate;
      }
      .skeleton i:nth-child(2) {
        width: 74%;
      }
      .skeleton i:nth-child(3) {
        height: 330px;
      }
      @keyframes pulse {
        to {
          background: #c9dade;
        }
      }
      .export-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        gap: 18px;
      }
      .export-summary {
        padding: 24px;
      }
      .export-action {
        padding: 24px;
        background: var(--ink);
        color: white;
      }
      .export-action h2 {
        margin-top: 0;
      }
      .export-action p {
        color: #bcd0d8;
      }
      .export-action .button {
        width: 100%;
        margin-top: 12px;
      }
      .success-receipt {
        border: 1px solid #7ebdb5;
        background: #e8f6f3;
        padding: 26px;
      }
      .success-receipt h2 {
        margin: 0 0 8px;
        font-size: 30px;
      }
      .success-receipt code {
        display: block;
        margin-top: 18px;
        padding: 12px;
        border: 1px solid #93c9c2;
        background: white;
        overflow-wrap: anywhere;
      }
      .sidepanel-stage {
        min-height: calc(100vh - 84px);
        display: grid;
        place-items: center;
        padding: 36px;
        background: #dfe8eb;
      }
      .sidepanel {
        width: min(410px, 100%);
        min-height: 690px;
        max-height: calc(100vh - 140px);
        overflow: auto;
        background: var(--paper);
        border: 1px solid var(--ink);
        box-shadow: var(--shadow);
      }
      .sidepanel .app-header {
        position: sticky;
        height: 62px;
        justify-content: flex-start;
        padding: 0 18px;
      }
      .sidepanel .header-context,
      .sidepanel .local-status {
        display: none;
      }
      .sidepanel-body {
        padding: 24px;
      }
      .sidepanel h1 {
        margin: 10px 0 16px;
        font-size: 34px;
        line-height: 0.98;
        letter-spacing: -0.04em;
      }
      .sidepanel h1 em {
        color: var(--signal-text);
        font-style: normal;
      }
      .sidepanel p {
        color: var(--muted);
        line-height: 1.5;
      }
      .mini-receipt {
        margin: 22px -24px;
        border-block: 1px solid var(--line);
      }
      .mini-receipt div {
        min-height: 42px;
        display: grid;
        grid-template-columns: 26px 1fr auto;
        align-items: center;
        gap: 8px;
        padding: 8px 24px;
        border-bottom: 1px solid var(--line-soft);
      }
      .mini-receipt div:last-child {
        border-bottom: 0;
      }
      .mini-receipt b {
        font: 650 11px var(--mono);
      }
      .recording-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }
      .timer {
        font: 700 28px var(--mono);
      }
      .recording-dot {
        width: 11px;
        height: 11px;
        display: inline-block;
        margin-left: 8px;
        background: var(--signal);
        border-radius: 50%;
        animation: blink 1.2s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      .steps {
        padding-left: 24px;
      }
      .steps li {
        padding: 8px 0 8px 6px;
        border-bottom: 1px solid var(--line-soft);
      }
      .sidepanel textarea {
        width: 100%;
        min-height: 88px;
        padding: 12px;
        border: 1px solid var(--line);
      }
      .action-row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .action-row .button {
        flex: 1;
      }
      .prototype-dock {
        position: fixed;
        z-index: 100;
        left: 12px;
        bottom: 14px;
        width: auto;
        display: grid;
        grid-template-columns: auto;
        align-items: center;
        gap: 8px;
        padding: 9px;
        background: var(--ink);
        color: white;
        box-shadow: 0 12px 34px rgb(0 0 0 / 0.3);
      }
      .prototype-dock.open {
        left: 50%;
        transform: translateX(-50%);
        width: min(1160px, calc(100% - 24px));
        grid-template-columns: auto auto minmax(170px, 0.7fr) minmax(260px, 1.4fr) auto auto auto;
      }
      .prototype-dock:not(.open) > :not(.dock-title) {
        display: none;
      }
      .prototype-dock label {
        font: 650 10px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .prototype-dock select,
      .prototype-dock button {
        border: 1px solid #536d7c;
        background: #173042;
        color: white;
        padding: 8px 10px;
      }
      .prototype-dock select {
        min-width: 0;
        width: 100%;
      }
      .prototype-dock .dock-title {
        padding: 0 8px;
        font-weight: 760;
        white-space: nowrap;
      }
      .prototype-dock .counter {
        min-width: 64px;
        text-align: center;
        font: 650 11px var(--mono);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .atlas {
        padding: 32px;
      }
      .atlas-head {
        max-width: 800px;
        margin-bottom: 28px;
      }
      .atlas-head h1 {
        margin: 0;
        font-size: clamp(36px, 5vw, 66px);
        letter-spacing: -0.04em;
      }
      .atlas-head p {
        color: var(--muted);
        font-size: 17px;
        line-height: 1.55;
      }
      .atlas-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }
      .atlas-group {
        padding: 20px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }
      .atlas-group h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      .atlas-group button {
        width: 100%;
        min-height: 0;
        padding: 9px 0;
        border: 0;
        border-top: 1px solid var(--line-soft);
        background: transparent;
        color: var(--ink);
        text-align: left;
      }
      .atlas-group button:hover {
        color: var(--signal-text);
      }
      .stress-long {
        overflow-wrap: anywhere;
      }
      [dir='rtl'] .receipt-spine {
        border-right: 0;
        border-left: 1px solid var(--line);
      }
      .forced-demo {
        filter: grayscale(1) contrast(1.35);
      }
      @media (max-width: 1000px) {
        .review-shell {
          display: block;
        }
        .receipt-spine {
          position: static;
          height: auto;
          padding: 16px 20px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .receipt-title,
        .receipt-list,
        .receipt-foot {
          display: none;
        }
        .receipt-spine > div {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
        }
        .stage {
          padding: 10px;
          border: 0;
          border-right: 1px solid var(--line);
        }
        .workspace {
          padding: 24px 20px 42px;
        }
        .report-grid,
        .export-layout {
          grid-template-columns: 1fr;
        }
        .captured-page {
          grid-template-columns: 1fr;
        }
        .atlas-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        .sidepanel-stage {
          padding: 36px 12px 100px;
        }
        .sidepanel {
          min-height: calc(100vh - 120px);
          max-height: none;
        }
        .app-header {
          padding: 0 16px;
        }
        .header-context,
        .local-status span {
          display: none;
        }
        .receipt-spine > div {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .stage {
          min-width: 0;
          grid-template-columns: 18px minmax(0, 1fr);
          gap: 4px;
          padding: 10px 6px;
        }
        .stage strong {
          font-size: 14px;
        }
        .stage > div {
          min-width: 0;
          overflow-wrap: anywhere;
        }
        .stage-state {
          display: none;
        }
        .stage small {
          display: none;
        }
        .stage-mark {
          grid-column: 1;
          grid-row: 2;
        }
        .workspace-heading {
          display: block;
        }
        .workspace-actions {
          margin-top: 16px;
          justify-content: flex-start;
        }
        .canvas {
          min-height: 390px;
          padding: 12px;
        }
        .captured-page {
          padding: 24px;
          min-height: 350px;
        }
        .prototype-dock.open {
          grid-template-columns: auto minmax(0, 1fr) auto auto auto;
        }
        .prototype-dock.open label {
          display: none;
        }
        .prototype-dock.open select:nth-of-type(1) {
          display: none;
        }
        .atlas {
          padding: 20px 16px;
        }
        .atlas-grid {
          grid-template-columns: 1fr;
        }
        .export-layout > * {
          min-width: 0;
        }
        .export-summary {
          padding: 12px;
        }
        .receipt-table,
        .receipt-table tbody,
        .receipt-table tr,
        .receipt-table td {
          display: block;
          width: 100%;
        }
        .receipt-table thead {
          display: none;
        }
        .receipt-table tr {
          padding: 10px 0;
          border-bottom: 1px solid var(--line);
        }
        .receipt-table td {
          padding: 3px 6px;
          border: 0;
          overflow-wrap: anywhere;
        }
        .receipt-table td:first-child {
          font-weight: 750;
        }
        .receipt-table td:last-child {
          color: var(--ok);
        }
        .export-action .mono {
          overflow-wrap: anywhere;
        }
        .network-row {
          grid-template-columns: 58px 58px minmax(0, 1fr);
        }
        .network-row > :nth-child(4),
        .network-row > :nth-child(5) {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Modern workbench — derived from ISPCine Option A's quiet midnight surfaces. */
      :root {
        color-scheme: dark;
        --ink: #f6f1e8;
        --ink-2: #fffaf2;
        --muted: #a9b3bd;
        --paper: #0d1823;
        --fog: #08121b;
        --line: rgb(255 255 255 / 0.1);
        --line-soft: rgb(255 255 255 / 0.065);
        --signal: #f0b35a;
        --signal-text: #f5c678;
        --trace: #55d6be;
        --trace-text: #8ce8d6;
        --trace-soft: rgb(85 214 190 / 0.1);
        --warn: #f0b35a;
        --warn-soft: rgb(240 179 90 / 0.09);
        --danger: #ff8d82;
        --danger-soft: rgb(255 111 97 / 0.09);
        --ok: #7de3d0;
        --shadow: 0 22px 58px rgb(0 0 0 / 0.32);
        --mono: JetBrains, ui-monospace, monospace;
        --sans: Bricolage, ui-sans-serif, system-ui, sans-serif;
      }
      html {
        background: #050b11;
        color: var(--ink);
        font-family: var(--sans);
      }
      body {
        background: var(--fog);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.45;
      }
      ::selection {
        background: var(--signal);
        color: #211708;
      }
      ::placeholder {
        color: #7e8b97;
      }
      * {
        scrollbar-color: #324757 #09131c;
      }
      :focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 3px;
      }
      button,
      input,
      textarea,
      select {
        letter-spacing: -0.01em;
      }
      button,
      select {
        min-height: 40px;
      }
      .app-header {
        height: 64px;
        gap: 22px;
        padding: 0 24px;
        background: rgb(5 11 17 / 0.9);
        border-color: var(--line-soft);
        backdrop-filter: blur(18px);
      }
      .brand {
        gap: 10px;
        color: #fffaf2;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.025em;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-content: center;
        gap: 2px;
        padding: 8px;
        transform: none;
        border-radius: 10px;
        background: #142633;
        color: var(--ink);
      }
      .brand-mark i {
        width: 18px;
        height: 3px;
        transform: skewX(-10deg);
        border-radius: 1px;
        background: #f6f1e8;
      }
      .brand-mark i:nth-child(2) {
        width: 14px;
        background: var(--signal);
      }
      .brand-mark i:nth-child(3) {
        width: 10px;
        background: var(--trace);
      }
      .header-context {
        gap: 16px;
        flex: 1;
      }
      .header-context::before {
        height: 26px;
        background: var(--line);
      }
      .header-context strong {
        color: #e7ebef;
        font-size: 13px;
        font-weight: 600;
      }
      .header-context span,
      .local-status {
        color: #8794a0;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      .local-status {
        min-height: 32px;
        padding: 6px 10px;
        border: 1px solid rgb(85 214 190 / 0.2);
        border-radius: 999px;
        background: rgb(85 214 190 / 0.055);
        color: #9feada;
      }
      .local-status i {
        width: 7px;
        height: 7px;
        background: var(--trace);
      }
      .button {
        min-height: 40px;
        padding: 8px 13px;
        border-color: var(--line);
        border-radius: 10px;
        background: rgb(255 255 255 / 0.035);
        color: #e9edf0;
        font-size: 13px;
        font-weight: 650;
        box-shadow: none;
        transition:
          transform 170ms cubic-bezier(0.16, 1, 0.3, 1),
          background 170ms ease,
          border-color 170ms ease,
          color 170ms ease;
      }
      .button:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: rgb(255 255 255 / 0.2);
        background: rgb(255 255 255 / 0.075);
      }
      .button.primary,
      .button.signal {
        border-color: transparent;
        background: var(--signal);
        color: #201507;
        box-shadow: 0 10px 28px rgb(0 0 0 / 0.24);
      }
      .button.primary:hover:not(:disabled),
      .button.signal:hover:not(:disabled) {
        background: #f6c477;
        color: #201507;
      }
      .button.quiet {
        border-color: var(--line);
        background: rgb(255 255 255 / 0.025);
      }
      .button.danger {
        border-color: rgb(255 111 97 / 0.24);
        background: var(--danger-soft);
        color: #ffaca4;
      }
      .button.icon {
        width: 40px;
        padding: 0;
        border-radius: 10px;
      }
      .review-shell {
        min-height: calc(100vh - 64px);
        grid-template-columns: 258px minmax(0, 1fr);
        background: #08121b;
      }
      .receipt-spine {
        top: 64px;
        height: calc(100vh - 64px);
        padding: 24px 18px;
        border-color: var(--line-soft);
        background: #0a151f;
      }
      .receipt-spine::before {
        display: none;
      }
      .receipt-title {
        margin-bottom: 18px;
        color: #edf1f4;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .receipt-title small {
        margin-top: 4px;
        color: #7f8d99;
        font-size: 9px;
        font-weight: 500;
      }
      .stage {
        grid-template-columns: 22px 1fr auto;
        gap: 9px;
        margin-bottom: 4px;
        padding: 12px 10px;
        border: 0;
        border-radius: 11px;
      }
      .stage:last-of-type {
        border: 0;
      }
      .stage.active {
        background: rgb(240 179 90 / 0.095);
      }
      .stage.done {
        background: rgb(85 214 190 / 0.04);
      }
      .stage-num {
        color: #74828e;
        font-size: 9px;
      }
      .stage strong {
        color: #cfd6dc;
        font-size: 13px;
        font-weight: 650;
      }
      .stage small {
        margin-top: 2px;
        color: #7f8d99;
        font-size: 11px;
      }
      .stage.active strong {
        color: #f6c677;
      }
      .stage-mark {
        width: 18px;
        height: 18px;
        border-color: var(--line);
        border-radius: 6px;
      }
      .stage.done .stage-mark {
        border-color: transparent;
        background: var(--trace);
        color: #06110f;
      }
      .stage.active .stage-mark {
        border-color: transparent;
        background: var(--signal);
        color: #201507;
      }
      .receipt-list {
        margin: 20px 0;
        padding-top: 12px;
        border-top: 1px solid var(--line-soft);
      }
      .receipt-list li {
        min-height: 38px;
        border-color: var(--line-soft);
        color: #aeb8c1;
        font-size: 12px;
      }
      .receipt-list b {
        color: #e9edf0;
        font-size: 10px;
        font-weight: 500;
      }
      .receipt-list .attention {
        color: #f6c677;
      }
      .receipt-foot {
        margin-top: 20px;
        color: #778691;
        font-size: 11px;
      }
      .workspace {
        padding: 26px 30px 44px;
        animation: workspace-in 220ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes workspace-in {
        from {
          opacity: 0.01;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .workspace-heading {
        align-items: center;
        margin-bottom: 18px;
      }
      .workspace-heading h1 {
        color: #f5f1ea;
        font-size: 27px;
        line-height: 1.12;
        font-weight: 650;
        letter-spacing: -0.025em;
      }
      .workspace-heading p {
        margin-top: 7px;
        max-width: 68ch;
        color: #95a2ad;
        font-size: 13px;
        line-height: 1.55;
      }
      .workspace-actions {
        gap: 8px;
      }
      .tabs {
        width: fit-content;
        max-width: 100%;
        gap: 3px;
        margin-bottom: 12px;
        padding: 4px;
        border-color: var(--line-soft);
        border-radius: 13px;
        background: #0b1620;
      }
      .tab {
        min-width: 116px;
        padding: 9px 13px;
        border: 0;
        border-radius: 9px;
        color: #8f9ca7;
        font-size: 12px;
        font-weight: 600;
      }
      .tab:hover {
        color: #e8ecef;
        background: rgb(255 255 255 / 0.035);
      }
      .tab[aria-selected='true'] {
        background: var(--signal);
        color: #201507;
        box-shadow: none;
      }
      .tab span {
        font-size: 9px;
        font-weight: 500;
      }
      .panel {
        overflow: hidden;
        border-color: var(--line);
        border-radius: 15px;
        background: #0d1823;
      }
      .panel-head {
        min-height: 58px;
        padding: 11px 14px;
        border-color: var(--line-soft);
        background: #0f1b26;
      }
      .panel-head strong {
        color: #edf1f4;
        font-size: 14px;
        font-weight: 650;
      }
      .panel-head p {
        color: #83919c;
        font-size: 11px;
      }
      .canvas {
        min-height: 440px;
        padding: 24px;
        background: #09131c;
      }
      .captured-page {
        min-height: 360px;
        gap: 28px;
        padding: 38px;
        border: 0;
        border-radius: 14px;
        background: #f5f2eb;
        color: #17222c;
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.3);
      }
      .captured-page h2 {
        color: #101922;
        font-size: 32px;
        line-height: 1.04;
        letter-spacing: -0.03em;
      }
      .captured-page p {
        color: #5f6d76;
        font-size: 13px;
      }
      .captured-page .button.primary {
        background: #16232d;
        color: white;
      }
      .failure-card {
        border-color: #d7d3cb;
        border-radius: 11px;
        background: white;
      }
      .failure-card .failed {
        border-color: #ebaaa4;
        border-radius: 8px;
        background: #fff0ee;
        color: #a73329;
        font-size: 12px;
      }
      .failure-card .failed {
        max-width: 100%;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .canvas-footer {
        padding: 11px 14px;
        border-color: var(--line-soft);
        background: #0f1b26;
      }
      .status-chip {
        min-height: 27px;
        padding: 4px 8px;
        border-color: var(--line);
        border-radius: 999px;
        font-size: 9px;
        font-weight: 500;
      }
      .status-chip.ok {
        border-color: rgb(85 214 190 / 0.2);
        background: var(--trace-soft);
        color: var(--trace-text);
      }
      .status-chip.warn {
        border-color: rgb(240 179 90 / 0.2);
        background: var(--warn-soft);
        color: #f3c675;
      }
      .notice {
        grid-template-columns: 20px 1fr auto;
        gap: 11px;
        margin-bottom: 14px;
        padding: 12px 13px;
        border-color: var(--line);
        border-radius: 12px;
        background: #0e1a25;
        font-size: 13px;
      }
      .notice strong {
        color: #e9edf0;
        font-weight: 650;
      }
      .notice p {
        color: #99a6b0;
        font-size: 12px;
      }
      .notice.error {
        border-color: rgb(255 111 97 / 0.2);
        background: var(--danger-soft);
        color: var(--danger);
      }
      .notice.warning {
        border-color: rgb(240 179 90 / 0.2);
        background: var(--warn-soft);
        color: #f3c675;
      }
      .notice.success {
        border-color: rgb(85 214 190 / 0.2);
        background: var(--trace-soft);
        color: var(--trace-text);
      }
      .notice > .button.icon {
        align-self: start;
      }
      .receipt-table th,
      .receipt-table td {
        padding: 11px 10px;
        border-color: var(--line-soft);
      }
      .receipt-table th {
        color: #82909b;
        font-size: 9px;
        font-weight: 500;
      }
      .receipt-table td {
        color: #cfd6dc;
        font-size: 12px;
      }
      .receipt-table td:last-child {
        color: #98decf;
        font-size: 10px;
      }
      .report-grid {
        grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
        gap: 14px;
      }
      .form-sheet,
      .context-sheet {
        padding: 18px;
      }
      .field {
        margin-bottom: 15px;
      }
      .field label {
        margin-bottom: 6px;
        color: #dce2e6;
        font-size: 12px;
        font-weight: 600;
      }
      .field label small {
        color: #788792;
        font-size: 9px;
        font-weight: 500;
      }
      .field input,
      .field textarea,
      .sidepanel textarea {
        border-color: var(--line);
        border-radius: 10px;
        background: #09131c;
        color: #ecf0f2;
        font-size: 13px;
      }
      .field input:focus,
      .field textarea:focus,
      .sidepanel textarea:focus {
        border-color: var(--signal);
        outline: 0;
        box-shadow: 0 0 0 3px rgb(240 179 90 / 0.1);
      }
      .field textarea {
        min-height: 82px;
      }
      .field.invalid input,
      .field.invalid textarea {
        border-color: rgb(255 111 97 / 0.6);
        background: rgb(255 111 97 / 0.045);
      }
      .context-sheet h2 {
        margin: 0 0 10px;
        color: #edf1f4;
        font-size: 16px;

          Object.assign(next, { surface: action.surface, state: action.state });

          next.steps.push(action.value.trim());

        if (action.type === 'UPDATE_REPORT') next.report[action.field] = action.value;

            surface: 'review',
            state: next.report.title.trim() ? 'evidence' : 'validation',

            state: action.value === 'screen' ? 'evidence' : action.value,

            surface: 'review',
            state: next.activeEvidence === 'screen' ? 'evidence' : next.activeEvidence,

reproduce <small>${stepCount} / 50</small></label><textarea id="issue-steps" data-report-field="reproduction">${escapeHtml(flow.report.reproduction)}</textarea></div></section><aside class="panel context-sheet"><h2>Capture context</h2><dl><div><dt>Page</dt><dd>formflow.example/review</dd></div><div><dt>Captured</dt><dd>Sep 14, 2026 · 21:14</dd></div><div><dt>Browser</dt><dd>Chrome 140</dd></div><div><dt>Platform</dt><dd>Linux x86_64</dd></div><div><dt>Duration</dt><dd class="mono">04:28</dd></div></dl></aside></div>`;

      const visualCanvas = (state) => {

ownload frame', 'quiet', 'download')}${button('Remove', 'danger', 'trash')}</div></section>`;

      const consolePanel = (state) =>

      function renderEvidence(state) {

        const keepEvidenceContext = [
          'annotate-diagnostic',
          'highlight-text',
          'removal-warning',

        const consoleMode =

        return `${top}<div class="workspace-heading"><div><h1>Evidence in review</h1><p>Review each evidence class, preserve the clearest proof, and remove anything that should not leave the device.</p></div><div class="workspace-actions">${button('Back to report', 'quiet')}${state.id === 'batch-remove' ? button('Remove 3 selected', 'danger', 'trash') : button('Continue to export check', 'primary')}</div></div><div class="tabs" role="tablist"><button class="tab" aria-selected="${!consoleMode && !networkMode}">Screen <span>3/8</span></button><button class="tab" aria-selected="${consoleMode}">Console <span>3</span></button><button class="tab" aria-selected="${networkMode}">Network <span>2</span></button></div>${consoleMode ? consolePanel(state) : networkMode ? networkPanel(state) : visualCanvas(state)}`;
      }

      function renderExport(state) {
        const meta = stateMeta(state.id);
        if (state.id === 'export-success')
          return `<div class="workspace-heading"><div><h1>Report downloaded</h1><p>The evidence receipt matches the files saved to your device.</p></div></div><section class="success-receipt">${icon('check')}<h2>BugReceipt-2026-09-14-2114.zip</h2><p>8 files · 12.6 MB · 5 redactions applied · ${flow.removals} item${flow.removals === 1 ? '' : 's'} removed</p><code>Downloads/BugReceipt-2026-09-14-2114.zip</code><div class="action-row">${button('Open downloads', 'primary')}${button('Start another capture', 'quiet')}</div></section>`;
        return `${meta ? notice('error', meta[0], meta[1], meta[2]) : ''}${state.id === 'export-blocked' ? notice('warning', 'Export check blocked', 'Add an issue title and review one possible secret before downloading.', 'Go to issue title') : ''}<div class="workspace-heading"><div><h1>Export check</h1><p>Confirm the exact local files and privacy changes before anything leaves BugReceipt.</p></div><div class="workspace-actions">${button('Back to evidence', 'quiet')}</div></div><div class="export-layout"><section class="panel export-summary"><table class="receipt-table"><thead><tr><th>Item</th><th>Details</th><th>Status</th></tr></thead><tbody><tr><td>issue.md</td><td>Report, steps, environment</td><td>Included</td></tr><tr><td>recording.webm</td><td>04:28 · no audio</td><td>Included</td></tr><tr><td>frame-001.png</td><td>${flow.annotations} saved annotation${flow.annotations === 1 ? '' : 's'}</td><td>Included</td></tr><tr><td>console.json</td><td>3 entries · 2 highlights</td><td>Included</td></tr><tr><td>network.har</td><td>2 failed requests</td><td>Included</td></tr><tr><td>Privacy filter</td><td>5 sensitive values replaced</td><td>Applied</td></tr><tr><td>Removed</td><td>${flow.removals} evidence item${flow.removals === 1 ? '' : 's'}</td><td>Excluded</td></tr></tbody></table></section><aside class="export-action"><span class="mono">READY TO LEAVE THIS DEVICE</span><h2>${state.id === 'exporting' ? 'Preparing local files…' : 'Choose output'}</h2><p>No account or upload is involved. Every option contains the same reviewed files.</p>${button(state.id === 'exporting' ? 'Preparing ZIP…' : 'Download ZIP', 'signal', 'download')}${button('Save report folder', 'quiet', 'download')}${button('Copy Markdown', 'quiet')}</aside></div>`;
      }

      function renderReview(state) {
        const statePage = [
          'no-capture',

        if (statePage.includes(state.id)) {
          const meta = stateMeta(state.id) || [

            'Return to the side panel and start a new capture.',

          return `${header('Evidence review')}<main class="state-page"><div class="state-card"><span class="state-symbol">!</span><h2>${meta[0]}</h2><p>${meta[1]}</p>${button(meta[2], 'primary', 'retry')}<details><summary>Technical details</summary><p class="mono">BR-${state.id.toUpperCase()} · local runtime state</p></details></div></main>`;
        }
        let stage = [
          'report',
          'autosaving',

          'save-failed',

            : '';
        return `<div dir="${dir}" class="${shellClass}">${header(state.label)}<main class="review-shell">${receiptSpine(stage, state)}<section class="workspace">${content}</section></main>${destructiveDialog}</div>`;

      function renderAtlas() {
        const grouped = states
          .filter((s) => s.surface !== 'atlas')
          .reduce((acc, s) => {
            (acc[s.group] ??= []).push(s);
            return acc;
          }, {});
        return `${header('Prototype state atlas')}<main class="atlas"><div class="atlas-head"><h1>Every state has a home.</h1><p>This atlas is the prototype’s acceptance map. Select any state to inspect its hierarchy, copy, recovery action, and shared component behavior.</p></div><div class="atlas-grid">${Object.entries(
          grouped,
        )
          .map(
            ([group, items]) =>
              `<section class="atlas-group"><h2>${group}</h2>${items.map((s) => `<button type="button" data-open-state="${s.surface}:${s.id}">${s.label}</button>`).join('')}</section>`,
          )
          .join('')}</div></main>`;
      }

      function visibleStates() {
        return states.filter((s) => s.surface === currentSurface);
      }
      function syncUrl() {
        const url = new URL(location.href);
        url.searchParams.set('surface', currentSurface);
        url.searchParams.set('state', currentState);
        history.replaceState(null, '', url);
      }
      let sequenceToken = 0;
      function navigate(surface, state, announcement = '') {
        const previousEvidence = flow.activeEvidence;
        flow = transition(flow, { type: 'NAVIGATE', surface, state });
        if (state.startsWith('console')) flow.activeEvidence = 'console';
        if (state.startsWith('network')) flow.activeEvidence = 'network';
        if (
          ['annotate-diagnostic', 'highlight-text'].includes(state) &&
          !['console', 'network'].includes(previousEvidence)
        )
          flow.activeEvidence = 'console';
        if (state === 'evidence' || state.startsWith('frame') || state === 'screenshot')
          flow.activeEvidence = 'screen';
        currentSurface = flow.surface;
        currentState = flow.state;
        syncUrl();
        render();
        if (announcement) document.querySelector('#flow-status').textContent = announcement;
      }
      function runSequence(routes) {
        const token = ++sequenceToken;
        let elapsed = 0;
        routes.forEach(([surface, state, delay, announcement]) => {
          elapsed += delay;
          setTimeout(() => {
            if (token === sequenceToken) navigate(surface, state, announcement);
          }, elapsed);
        });
      }
      function apply(action, announcement = '') {
        sequenceToken += 1;
        flow = transition(flow, action);
        currentSurface = flow.surface;
        currentState = flow.state;
        syncUrl();
        render();
        if (announcement) document.querySelector('#flow-status').textContent = announcement;
      }
      function completePrototypeAction(target, label, announcement) {
        target.innerHTML = `${icon('check')}${label}`;
        target.disabled = true;
        document.querySelector('#flow-status').textContent = announcement;
      }
      function render() {
        const state =
          states.find((s) => s.surface === currentSurface && s.id === currentState) || states[0];
        document.querySelector('#app').innerHTML =
          currentSurface === 'sidepanel'
            ? renderSidepanel(state)
            : currentSurface === 'review'
              ? renderReview(state)
              : renderAtlas();
        const surfacePicker = document.querySelector('#surface-picker');
        surfacePicker.innerHTML = Object.entries(surfaceNames)
          .map(
            ([id, label]) =>
              `<option value="${id}" ${id === currentSurface ? 'selected' : ''}>${label}</option>`,
          )
          .join('');
        const statePicker = document.querySelector('#state-picker');
        statePicker.innerHTML = visibleStates()
          .map(
            (s) =>
              `<option value="${s.id}" ${s.id === currentState ? 'selected' : ''}>${s.label}</option>`,
          )
          .join('');
        const list = visibleStates();
        document.querySelector('#state-counter').textContent =
          `${list.findIndex((s) => s.id === currentState) + 1} / ${list.length}`;
        const addStep = [...document.querySelectorAll('#app button')].find(
          (el) => el.textContent.trim() === 'Add step',
        );
        const stepInput = document.querySelector('#prototype-step');
        if (addStep && stepInput) {
          addStep.disabled = !stepInput.value.trim();
          stepInput.addEventListener('input', () => {
            addStep.disabled = !stepInput.value.trim();
          });
        }
        const dialogButton = document.querySelector('[role="dialog"] button');
        if (dialogButton) requestAnimationFrame(() => dialogButton.focus());
      }
      function move(delta) {
        const list = visibleStates();
        const index = list.findIndex((s) => s.id === currentState);
        navigate(currentSurface, list[(index + delta + list.length) % list.length].id);
      }
      document.querySelector('#toggle-lab').addEventListener('click', (e) => {
        const dock = e.currentTarget.closest('.prototype-dock');
        const open = dock.classList.toggle('open');
        e.currentTarget.setAttribute('aria-expanded', String(open));
        e.currentTarget.textContent = open ? 'Close edge cases' : 'Edge cases';
      });
      document.querySelector('#surface-picker').addEventListener('change', (e) => {
        const surface = e.target.value;
        const state = states.find((item) => item.surface === surface).id;
        navigate(surface, state);
      });
      document
        .querySelector('#state-picker')
        .addEventListener('change', (e) => navigate(currentSurface, e.target.value));
      document.querySelector('#prev-state').addEventListener('click', () => move(-1));
      document.querySelector('#next-state').addEventListener('click', () => move(1));
      document.querySelector('#app').addEventListener('input', (e) => {
        const field = e.target.dataset.reportField;
        if (!field) return;
        flow = transition(flow, { type: 'UPDATE_REPORT', field, value: e.target.value });
        if (field === 'title')
          document.querySelector('[data-title-count]').textContent =
            `${e.target.value.length} / 200`;
      });
      document.querySelector('#app').addEventListener('click', (e) => {
        const atlasTarget = e.target.closest('[data-open-state]');
        if (atlasTarget) {
          const [surface, state] = atlasTarget.dataset.openState.split(':');
          navigate(surface, state);
          return;
        }
        const target = e.target.closest('button');
        if (!target || target.disabled) return;
        sequenceToken += 1;
        if (target.classList.contains('tab')) {
          const evidence = target.textContent.trim().split(/\s/)[0].toLowerCase();
          apply({ type: 'SELECT_EVIDENCE', value: evidence }, `${evidence} evidence selected`);
          return;
        }
        const label =
          target.getAttribute('aria-label') || target.textContent.replace(/\s+/g, ' ').trim();
        if (target.closest('.frame-strip')) {
          target
            .closest('.frame-strip')
            .querySelectorAll('button')
            .forEach((frame) => frame.removeAttribute('aria-current'));
          target.setAttribute('aria-current', 'true');
          document.querySelector('#flow-status').textContent = `${label} selected`;
        } else if (
          ['Select', 'Border', 'Highlight', 'Text'].includes(label) &&
          target.closest('.annotation-toolbar')
        ) {
          apply(
            { type: 'SET_ANNOTATION_TOOL', value: label.toLowerCase() },
            `${label} annotation tool selected`,
          );
        } else if (label === 'Undo' && target.closest('.annotation-toolbar')) {
          flow.annotations = Math.max(0, flow.annotations - 1);
          completePrototypeAction(target, 'Nothing else to undo', 'Annotation undo applied');
        } else if (label === 'Clear all' && target.closest('.annotation-toolbar')) {
          flow.annotations = 0;
          document
            .querySelectorAll('.annotation-box,.annotation-note')
            .forEach((mark) => mark.remove());
          completePrototypeAction(target, 'Markup cleared', 'All draft markup cleared');
        } else if (['Download frame', 'Download JSON', 'Download HAR'].includes(label)) {
          const readyLabel = label.replace('Download', '').trim() + ' ready';
          completePrototypeAction(target, readyLabel, `${readyLabel} for local download`);
        } else if (label === 'Allow site access' || label === 'Grant access') {
          navigate('sidepanel', 'requesting-access', 'Requesting access');
          runSequence([['sidepanel', 'access-granted', 650, 'Site access granted']]);
        } else if (
          ['Choose tab & start', 'Choose again', 'Retry capture', 'Check another tab'].includes(
            label,
          )
        ) {
          navigate('sidepanel', 'chooser', 'Waiting for tab selection');
          runSequence([
            ['sidepanel', 'starting', 500, 'Starting capture'],
            ['sidepanel', 'recording-empty', 650, 'Capture started'],
          ]);
        } else if (label === 'Add step') {
          apply(
            { type: 'ADD_STEP', value: document.querySelector('#prototype-step')?.value || '' },
            'Step added',
          );
        } else if (label === 'Stop & review') {
          navigate('sidepanel', 'stopping', 'Preparing review');
          runSequence([['sidepanel', 'stopped', 700, 'Capture complete']]);
        } else if (
          label === 'Open review' ||
          (label === 'Try again' && currentState === 'review-failed')
        ) {
          navigate('sidepanel', 'opening-review', 'Opening review');
          runSequence([['review', 'report', 650, 'Review opened']]);
        } else if (label === 'Continue to evidence') {
          document.querySelectorAll('[data-report-field]').forEach((field) => {
            flow = transition(flow, {
              type: 'UPDATE_REPORT',
              field: field.dataset.reportField,
              value: field.value,
            });
          });
          apply(
            { type: 'CONTINUE_REPORT' },
            flow.report.title.trim() ? 'Evidence review opened' : 'Issue title is required',
          );
        } else if (label === 'Back to report') {
          navigate('review', 'report', 'Report reopened');
        } else if (label === 'Back to evidence') {
          apply(
            { type: 'SELECT_EVIDENCE', value: flow.activeEvidence },
            'Evidence review reopened',
          );
        } else if (label === 'Go to field' || label === 'Go to issue title') {
          navigate('review', 'report');
          requestAnimationFrame(() => document.querySelector('#issue-title')?.focus());
        } else if (label === 'Mark frame' || label === 'Highlight text') {
          flow.annotationTool = label === 'Highlight text' ? 'highlight' : 'select';
          navigate('review', 'annotate-frame', 'Frame markup opened');
        } else if (label === 'Mark console view' || label === 'Mark network view') {
          navigate('review', 'annotate-diagnostic', 'Diagnostic markup opened');
        } else if (label === 'Highlight exact text') {
          navigate('review', 'highlight-text', 'Text highlighting opened');
        } else if (label === 'Save markup') {
          apply({ type: 'SAVE_MARKUP' }, 'Markup saved');
        } else if (label === 'Cancel') {
          apply({ type: 'SELECT_EVIDENCE', value: flow.activeEvidence }, 'Markup cancelled');
        } else if (
          label === 'Remove' ||
          label.startsWith('Remove console') ||
          label.startsWith('Remove request')
        ) {
          navigate('review', 'removal-warning', 'Removal confirmation opened');
        } else if (label === 'Keep evidence') {
          apply({ type: 'SELECT_EVIDENCE', value: flow.activeEvidence }, 'Evidence kept');
        } else if (label === 'Remove evidence' || label === 'Remove 3 selected') {
          apply(
            { type: 'REMOVE_EVIDENCE', count: label === 'Remove 3 selected' ? 3 : 1 },
            'Evidence removed. Undo is available.',
          );
        } else if (label === 'Undo removal') {
          apply({ type: 'UNDO_REMOVAL' }, 'Evidence restored');
        } else if (label === 'Continue to export check') {
          navigate('review', 'export', 'Export check opened');
        } else if (['Download ZIP', 'Save report folder', 'Copy Markdown'].includes(label)) {
          navigate('review', 'exporting', 'Preparing local files');
          runSequence([['review', 'export-success', 850, 'Report downloaded']]);
        } else if (label === 'Start another capture' || label === 'Open side panel') {
          apply({ type: 'RESET' }, 'New capture ready');
        } else if (label === 'Open downloads') {
          target.textContent = 'Downloads would open';
          target.disabled = true;
        } else if (label === 'Discard') {
          navigate('sidepanel', 'discard-confirm', 'Discard confirmation opened');
        } else if (label === 'Keep capture') {
          navigate(
            currentSurface,
            currentSurface === 'sidepanel'
              ? flow.steps.length
                ? 'recording'
                : 'recording-empty'
              : 'evidence',
            'Capture kept',
          );
        } else if (label === 'Discard capture' || label === 'Delete capture') {
          apply({ type: 'RESET' }, 'Local capture deleted');
        } else if (label === 'Continue with available evidence') {
          navigate('review', 'evidence', 'Continuing with available evidence');
        } else if (label === 'Capture frame from recording' || label === 'Capture again') {
          navigate('review', 'frame-pending', 'Capturing frame');
          runSequence([['review', 'multi-frame', 650, 'Frame captured']]);
        } else if (label === 'Retry save') {
          if (currentState === 'annotation-failed') apply({ type: 'SAVE_MARKUP' }, 'Markup saved');
          else {
            navigate('review', 'autosaving', 'Saving changes');
            runSequence([
              ['review', 'saved', 550, 'Changes saved'],
              ['review', 'report', 750, 'Report ready'],
            ]);
          }
        } else if (label.startsWith('Retry download') || label === 'Download Markdown') {
          navigate('review', 'exporting', 'Preparing local files');
          runSequence([['review', 'export-success', 750, 'Report downloaded']]);
        } else if (label === 'Read active tab') {
          navigate('sidepanel', 'access-granted', 'Active tab found');
        } else if (label === 'Return to tab') {
          navigate(
            'sidepanel',
            flow.steps.length ? 'recording' : 'recording-empty',
            'Recorded tab opened',
          );
        } else if (label === 'Retry recording') {
          navigate('review', 'recording-loading', 'Loading recording');
          runSequence([['review', 'evidence', 650, 'Recording ready']]);
        } else if (label === 'Review storage') {
          navigate('review', 'export', 'Storage review opened');
        } else if (label === 'Review artifact') {
          navigate('review', 'evidence', 'Remaining evidence opened');
        } else if (label === 'Go to review') {
          navigate('review', 'report', 'Existing review opened');
        } else if (label === 'Reload') {
          navigate('review', 'review-loading', 'Reloading BugReceipt');
          runSequence([['review', 'report', 650, 'BugReceipt reloaded']]);
        } else if (label === 'Try again' && currentSurface === 'review') {
          navigate('review', 'review-loading', 'Retrying review');
          runSequence([['review', 'report', 650, 'Review ready']]);
        } else if (label === 'Try again') {
          navigate('sidepanel', 'access-needed', 'Ready to request site access again');
        } else if (label === 'Retry') {
          if (currentState === 'add-failed') {
            const failedStep = document.querySelector('#prototype-step')?.value.trim();
            if (failedStep && !flow.steps.includes(failedStep)) {
              flow.steps.push(failedStep);
              flow.report.reproduction = flow.steps.join('\n');
            }
            navigate('sidepanel', 'adding-step', 'Saving step');
            runSequence([
              [
                'sidepanel',
                flow.steps.length ? 'recording' : 'recording-empty',
                550,
                'Step entry ready',
              ],
            ]);
          } else if (currentState === 'discard-failed')
            navigate('sidepanel', 'discard-confirm', 'Discard confirmation reopened');
          else if (currentSurface === 'sidepanel')
            navigate('sidepanel', 'access-needed', 'Ready to retry');
          else navigate('review', 'evidence', 'Evidence review restored');
        }
      });
      addEventListener('keydown', (e) => {
        if (
          !document.querySelector('.prototype-dock').classList.contains('open') ||
          ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) ||
          e.target.isContentEditable
        )
          return;
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          move(-1);
        }
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          move(1);
        }
      });
      render();
    </script>
  </body>
</html>
